<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ugreen NAS Admin Web</title>
  <style>
    body { margin: 0; font-family: Segoe UI, Arial, sans-serif; background: #f3f4f6; color: #111827; }
    .app { display: flex; min-height: 100vh; }
    .nav { width: 260px; background: #111827; color: #e5e7eb; padding: 18px 12px; box-sizing: border-box; }
    .nav h2 { margin: 0 8px 14px; font-size: 18px; }
    .nav button { width: 100%; text-align: left; padding: 10px 12px; margin: 4px 0; border: 0; border-radius: 8px; background: transparent; color: #d1d5db; cursor: pointer; }
    .nav button.active, .nav button:hover { background: #1f2937; color: #fff; }
    .content { flex: 1; padding: 18px; box-sizing: border-box; }
    .card { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 16px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    input, textarea, select { border: 1px solid #d1d5db; border-radius: 8px; padding: 8px; font: inherit; }
    textarea { width: 100%; min-height: 220px; box-sizing: border-box; }
    .btn { border: 0; border-radius: 8px; padding: 8px 12px; background: #2563eb; color: #fff; cursor: pointer; }
    .btn.gray { background: #6b7280; }
    .hidden { display: none; }
    .mono { font-family: Consolas, monospace; white-space: pre-wrap; background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: 8px; min-height: 120px; }
    .small { font-size: 12px; color: #6b7280; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="nav">
      <h2>Ugreen NAS Admin</h2>
      <button data-view="settings" class="active">Verbindung</button>
      <button data-view="health">Health & SMART</button>
      <button data-view="docker">Docker</button>
      <button data-view="explorer">Explorer</button>
      <button data-view="scheduler">Scheduler</button>
      <button data-view="acl">ACL</button>
      <button data-view="snapshots">Snapshots</button>
    </aside>
    <main class="content">
      <section id="view-settings" class="card">
        <h3>Verbindung</h3>
        <div class="row">
          <input id="host" placeholder="Host/IP" />
          <input id="port" placeholder="Port" value="22" />
          <input id="user" placeholder="User" />
          <input id="password" type="password" placeholder="Password (auch sudo)" />
        </div>
        <div class="row" style="margin-top:8px;">
          <label><input id="ssh_use_key" type="checkbox" /> SSH-Key nutzen</label>
          <input id="ssh_key_path" placeholder="Key path" style="min-width:300px;" />
          <input id="ssh_key_passphrase" type="password" placeholder="Key passphrase (optional)" />
        </div>
        <div class="row" style="margin-top:10px;">
          <button class="btn" id="btn-save-settings">Speichern</button>
          <button class="btn gray" id="btn-test-settings">Verbindung testen</button>
          <button class="btn gray" id="btn-login">Login</button>
          <button class="btn gray" id="btn-logout">Logout</button>
        </div>
        <p class="small">Erster Login per ENV-Admin. Danach Session-Cookie im Browser.</p>
        <div id="settings-out" class="mono"></div>
      </section>

      <section id="view-health" class="card hidden">
        <h3>Health & SMART</h3>
        <div class="row">
          <button class="btn" id="btn-health-overview">Health laden</button>
          <button class="btn" id="btn-health-smart">SMART laden</button>
          <button class="btn gray" id="btn-health-report">Report erzeugen</button>
        </div>
        <div id="health-out" class="mono"></div>
      </section>

      <section id="view-docker" class="card hidden">
        <h3>Docker</h3>
        <div class="row">
          <button class="btn" id="btn-docker-list">Liste</button>
          <input id="docker-name" placeholder="container name" />
          <button class="btn" id="btn-docker-start">Start</button>
          <button class="btn gray" id="btn-docker-stop">Stop</button>
          <button class="btn gray" id="btn-docker-logs">Logs</button>
        </div>
        <div id="docker-out" class="mono"></div>
      </section>

      <section id="view-explorer" class="card hidden">
        <h3>Explorer</h3>
        <div class="row">
          <input id="exp-path" value="/volume1" style="min-width:280px;" />
          <button class="btn" id="btn-exp-list">List</button>
        </div>
        <div class="row" style="margin-top:8px;">
          <input id="exp-src" placeholder="src" style="min-width:280px;" />
          <input id="exp-dst" placeholder="dst" style="min-width:280px;" />
          <button class="btn" id="btn-exp-copy">Copy</button>
          <button class="btn gray" id="btn-exp-del">Delete Path</button>
        </div>
        <div class="row" style="margin-top:8px;">
          <input type="file" id="exp-file" />
          <input id="exp-upload-path" placeholder="/volume1/file.txt" style="min-width:280px;" />
          <button class="btn" id="btn-exp-upload">Upload</button>
          <input id="exp-download-path" placeholder="/volume1/file.txt" style="min-width:280px;" />
          <button class="btn gray" id="btn-exp-download">Download</button>
        </div>
        <div id="exp-out" class="mono"></div>
      </section>

      <section id="view-scheduler" class="card hidden">
        <h3>Scheduler</h3>
        <div class="row">
          <button class="btn" id="btn-sched-read">Laden</button>
          <button class="btn gray" id="btn-sched-save">Speichern</button>
        </div>
        <textarea id="sched-content"></textarea>
        <div id="sched-out" class="mono"></div>
      </section>

      <section id="view-acl" class="card hidden">
        <h3>ACL</h3>
        <div class="row">
          <input id="acl-path" placeholder="/volume1/path" style="min-width:280px;" />
          <button class="btn" id="btn-acl-stat">Stat</button>
          <input id="acl-mode" placeholder="755" />
          <button class="btn gray" id="btn-acl-chmod">Chmod</button>
          <input id="acl-owner" placeholder="papa:users" />
          <button class="btn gray" id="btn-acl-chown">Chown</button>
        </div>
        <div id="acl-out" class="mono"></div>
      </section>

      <section id="view-snapshots" class="card hidden">
        <h3>Snapshots</h3>
        <div class="row">
          <input id="snap-base" value="/volume1" style="min-width:220px;" />
          <button class="btn" id="btn-snap-list">List</button>
        </div>
        <div class="row" style="margin-top:8px;">
          <input id="snap-src" placeholder="src" style="min-width:220px;" />
          <input id="snap-dst" placeholder="dst" style="min-width:220px;" />
          <button class="btn" id="btn-snap-create">Create</button>
          <input id="snap-target" placeholder="target" style="min-width:220px;" />
          <button class="btn gray" id="btn-snap-delete">Delete</button>
        </div>
        <div id="snap-out" class="mono"></div>
      </section>
    </main>
  </div>

  <script>
    const j = (o) => JSON.stringify(o, null, 2);
    async function api(path, method = "GET", body) {
      const res = await fetch("/api" + path, {
        method,
        headers: {"Content-Type": "application/json"},
        credentials: "include",
        body: body ? JSON.stringify(body) : undefined
      });
      return res.json();
    }
    function out(id, val){ document.getElementById(id).textContent = typeof val === "string" ? val : j(val); }
    document.querySelectorAll(".nav button").forEach(b => {
      b.onclick = () => {
        document.querySelectorAll(".nav button").forEach(x => x.classList.remove("active"));
        b.classList.add("active");
        document.querySelectorAll("main section").forEach(s => s.classList.add("hidden"));
        document.getElementById("view-" + b.dataset.view).classList.remove("hidden");
      };
    });

    document.getElementById("btn-login").onclick = async () => out("settings-out", await api("/auth/login", "POST", {
      username: prompt("Admin user", "admin") || "admin",
      password: prompt("Admin password")
    }));
    document.getElementById("btn-logout").onclick = async () => out("settings-out", await api("/auth/logout", "POST"));
    document.getElementById("btn-save-settings").onclick = async () => out("settings-out", await api("/settings", "POST", {
      host: host.value, port: parseInt(port.value || "22"), user: user.value, password: password.value,
      ssh_use_key: ssh_use_key.checked, ssh_key_path: ssh_key_path.value, ssh_key_passphrase: ssh_key_passphrase.value
    }));
    document.getElementById("btn-test-settings").onclick = async () => out("settings-out", await api("/settings/test", "POST"));

    document.getElementById("btn-health-overview").onclick = async () => out("health-out", await api("/health/overview"));
    document.getElementById("btn-health-smart").onclick = async () => out("health-out", await api("/health/smart"));
    document.getElementById("btn-health-report").onclick = async () => out("health-out", await api("/health/report", "POST"));

    document.getElementById("btn-docker-list").onclick = async () => out("docker-out", await api("/docker/list"));
    document.getElementById("btn-docker-start").onclick = async () => out("docker-out", await api("/docker/start", "POST", {name: document.getElementById("docker-name").value}));
    document.getElementById("btn-docker-stop").onclick = async () => out("docker-out", await api("/docker/stop", "POST", {name: document.getElementById("docker-name").value}));
    document.getElementById("btn-docker-logs").onclick = async () => out("docker-out", await api("/docker/logs/" + encodeURIComponent(document.getElementById("docker-name").value)));

    document.getElementById("btn-exp-list").onclick = async () => out("exp-out", await api("/explorer/list", "POST", {path: document.getElementById("exp-path").value}));
    document.getElementById("btn-exp-copy").onclick = async () => out("exp-out", await api("/explorer/copy", "POST", {src: document.getElementById("exp-src").value, dst: document.getElementById("exp-dst").value}));
    document.getElementById("btn-exp-del").onclick = async () => out("exp-out", await api("/explorer/delete", "POST", {path: document.getElementById("exp-path").value}));
    document.getElementById("btn-exp-upload").onclick = async () => {
      const f = document.getElementById("exp-file").files[0];
      const path = document.getElementById("exp-upload-path").value;
      const fd = new FormData();
      fd.append("file", f);
      const res = await fetch("/api/explorer/upload?path=" + encodeURIComponent(path), {method: "POST", credentials: "include", body: fd});
      out("exp-out", await res.json());
    };
    document.getElementById("btn-exp-download").onclick = async () => {
      const p = document.getElementById("exp-download-path").value;
      const a = document.createElement("a");
      a.href = "/api/explorer/download?path=" + encodeURIComponent(p);
      a.target = "_blank";
      a.click();
      out("exp-out", "Download gestartet: " + p);
    };

    document.getElementById("btn-sched-read").onclick = async () => {
      const r = await api("/scheduler/read");
      out("sched-out", r);
      if (r.content) document.getElementById("sched-content").value = r.content;
    };
    document.getElementById("btn-sched-save").onclick = async () => out("sched-out", await api("/scheduler/save", "POST", {content: document.getElementById("sched-content").value}));

    document.getElementById("btn-acl-stat").onclick = async () => out("acl-out", await api("/acl/stat", "POST", {path: document.getElementById("acl-path").value}));
    document.getElementById("btn-acl-chmod").onclick = async () => out("acl-out", await api("/acl/chmod", "POST", {path: document.getElementById("acl-path").value, mode: document.getElementById("acl-mode").value}));
    document.getElementById("btn-acl-chown").onclick = async () => out("acl-out", await api("/acl/chown", "POST", {path: document.getElementById("acl-path").value, owner_group: document.getElementById("acl-owner").value}));

    document.getElementById("btn-snap-list").onclick = async () => out("snap-out", await api("/snapshots/list", "POST", {base: document.getElementById("snap-base").value}));
    document.getElementById("btn-snap-create").onclick = async () => out("snap-out", await api("/snapshots/create", "POST", {src: document.getElementById("snap-src").value, dst: document.getElementById("snap-dst").value}));
    document.getElementById("btn-snap-delete").onclick = async () => out("snap-out", await api("/snapshots/delete", "POST", {target: document.getElementById("snap-target").value}));

    (async () => {
      const b = await api("/auth/bootstrap");
      out("settings-out", "Bootstrap user: " + b.admin_user + "\\nBitte zuerst Login klicken.");
      try {
        const s = await api("/settings");
        if (s.settings) {
          host.value = s.settings.host || "";
          port.value = s.settings.port || 22;
          user.value = s.settings.user || "";
          password.value = s.settings.password || "";
          ssh_use_key.checked = !!s.settings.ssh_use_key;
          ssh_key_path.value = s.settings.ssh_key_path || "";
          ssh_key_passphrase.value = s.settings.ssh_key_passphrase || "";
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
