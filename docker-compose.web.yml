services:
  nasadmin-api:
    build:
      context: .
      dockerfile: web/api/Dockerfile
    container_name: nasadmin-api
    env_file:
      - .env.web
    volumes:
      - nasadmin_config:/app_data/config
      - nasadmin_reports:/app_data/reports
      - nasadmin_logs:/app_data/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/healthz', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - nasadmin_net

  nasadmin-web:
    build:
      context: .
      dockerfile: web/ui/Dockerfile
    container_name: nasadmin-web
    depends_on:
      nasadmin-api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8088}:80"
    restart: unless-stopped
    networks:
      - nasadmin_net

volumes:
  nasadmin_config:
  nasadmin_reports:
  nasadmin_logs:

networks:
  nasadmin_net:
    driver: bridge
