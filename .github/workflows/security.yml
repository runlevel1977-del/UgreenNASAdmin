name: Offline tests and dependency audit
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test dependencies on disposable runner
        run: python -m pip install --only-binary=:all: -r requirements.txt pip-audit==2.10.1
      - name: Offline regression suite (no NAS, vault or SMTP)
        run: python -B tests/run_offline_suite.py
      - name: Audit installed CI dependency set
        if: always()
        run: python -m pip_audit --format cyclonedx-json --output dependency-audit.json
      - name: Audit release lock when supplied by maintainer
        if: ${{ always() && hashFiles('packaging/requirements-build.lock.txt') != '' }}
        run: python -m pip_audit --no-deps --disable-pip -r packaging/requirements-build.lock.txt --format cyclonedx-json --output release-dependency-audit.json
      - name: Retain audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit-${{ matrix.os }}
          path: '*dependency-audit.json'
          if-no-files-found: warn
          retention-days: 14
